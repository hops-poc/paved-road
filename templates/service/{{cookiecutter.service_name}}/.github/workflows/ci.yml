# Session-1 skeleton: lint + typecheck + test, green, nothing else. Rewired
# in session 3 to call paved-road's reusable service.yml@v1 (full gate set,
# preview deploy, promotion) — CLAUDE.md/PRD §15. Don't add cloud steps here
# before that lands; this file's only job right now is "CI is green."
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
