# Calls paved-road's reusable gate/deploy/agents workflows instead of containing
# pipeline logic here — that's the paved road. Pin bumps to a new paved-road SHA
# go through a normal PR like any other change.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write   # must be granted at this (caller) level too — permissions
  contents: read      # intersect between caller and callee; a called job's own
  actions: read        # id-token/actions:read is silently dropped (or, for
                         # actions:read, hard-rejected at parse time) without this
                         # — conftest-terraform needs it for actions/download-artifact.

jobs:
  gates:
    uses: hops-poc/paved-road/.github/workflows/plan.yml@6984438e6d3d8746472c635c2ce1fe83188ad121
    secrets: inherit

  # ReviewBot's checkpoint only — explains a gate failure, PR or push, and
  # doesn't wait on deploy (which is skipped on PRs anyway, and can sit
  # pending prod approval for arbitrarily long on push:main). Dev/prod
  # deploy narration moved inside deploy.yml itself (narrate-dev/
  # narrate-prod), positioned at the actual points in that job DAG where
  # something worth narrating has happened — this job would otherwise be
  # stuck waiting through deploy-prod's entire approval wait before firing.
  agents-narrate:
    needs: gates
    if: always()
    uses: hops-poc/paved-road/.github/workflows/agents.yml@6984438e6d3d8746472c635c2ce1fe83188ad121

  deploy:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: hops-poc/paved-road/.github/workflows/deploy.yml@6984438e6d3d8746472c635c2ce1fe83188ad121
