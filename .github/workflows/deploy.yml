# Reusable workflow: dev deploy on merge to main, then prod deploy gated on
# a human-approved GitHub Environment review. Called by hello-world-svc's
# ci.yml via workflow_call. This file's path is what bootstrap/iam.tf's
# paved-road-deploy-dev / paved-road-deploy-prod trust policies match via
# job_workflow_ref — don't rename it without updating those trust policies.
name: deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Preview environment deploy (per-PR `pr-<n>` stacks) is deferred to a
  # future pass. When it lands: same fork-gate pattern as plan.yml's
  # tofu-plan (`sub` doesn't distinguish fork PRs), the deploy-dev role
  # (its trust policy already allows `pull_request` subs for this),
  # enable_cloudfront=false on the module. Seam documented, not built.
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      dev_url: ${{ steps.deploy.outputs.dev_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::281832122084:role/paved-road-deploy-dev
          aws-region: us-east-1
      - name: Login to shared ECR repo
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 281832122084.dkr.ecr.us-east-1.amazonaws.com
      # modules/service's Lambda is architectures=["arm64"], but this runner
      # is amd64 — found live: a build with no --platform flag defaulted to
      # amd64 and deployed fine (no error), but the Lambda then failed every
      # invocation with Runtime.InvalidEntrypoint (an amd64 image on an
      # arm64 function). QEMU + the docker-container buildx driver are what
      # make cross-platform --platform linux/arm64 actually work here;
      # neither is present on GitHub-hosted runners by default.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build and push image, capture digest
        id: build
        # ECR's repo is image_tag_mutability=IMMUTABLE (ecr_image_pinning
        # policy) — a re-run of this job for the same commit (tofu apply
        # failing after a successful push, then a retry) would otherwise
        # fail re-pushing the same $GITHUB_SHA tag. Found live. Reuse the
        # existing digest instead of re-pushing when the tag already exists.
        run: |
          set -euo pipefail
          REPO_NAME=hello-world-svc
          REPO=281832122084.dkr.ecr.us-east-1.amazonaws.com/$REPO_NAME
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag=$GITHUB_SHA --region us-east-1 >existing.json 2>/dev/null; then
            DIGEST=$(jq -r '.imageDetails[0].imageDigest' existing.json)
            echo "Tag $GITHUB_SHA already pushed (digest $DIGEST) — reusing, not rebuilding."
          else
            # --provenance=false: buildx adds a minimal provenance attestation
            # by default (documented default since buildx 0.10+), which turns
            # a single-platform push into a multi-manifest OCI index. Lambda's
            # UpdateFunctionCode rejects that outright — found live:
            # "InvalidParameterValueException: image manifest, config or
            # layer media type ... is not supported." Lambda wants one plain
            # image manifest.
            docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push -t "$REPO:$GITHUB_SHA" --metadata-file metadata.json .
            DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
          fi
          echo "image_uri=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
      - name: Deploy dev
        id: deploy
        run: |
          cd infra/dev
          tofu init
          tofu apply -auto-approve -var image_uri=${{ steps.build.outputs.image_uri }}
          echo "dev_url=$(tofu output -raw url)" >> "$GITHUB_OUTPUT"

  # Separate job (not a step inside deploy-dev) so pass/fail shows as its
  # own check in the Actions UI — a human deciding whether to approve prod
  # can see "smoke-test-dev passed" directly, not dig into deploy-dev's step
  # log. No AWS credentials needed: it only curls the public URL.
  smoke-test-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      # Mirrors src/server.test.ts's assertions, run against the live dev
      # URL instead of an in-process server.
      - name: Smoke test dev
        run: |
          URL="${{ needs.deploy-dev.outputs.dev_url }}"
          curl -sf "$URL" | grep -q "<title>hello-world-svc</title>" || { echo "homepage: unexpected content"; exit 1; }
          HELLO=$(curl -sf "$URL/api/hello")
          echo "$HELLO" | jq -e '.message | contains("hello from")' >/dev/null || { echo "api/hello: unexpected response: $HELLO"; exit 1; }
          HEALTH=$(curl -sf "$URL/api/healthz")
          [ "$HEALTH" = "ok" ] || { echo "api/healthz: unexpected response: $HEALTH"; exit 1; }
          echo "smoke test passed: homepage, /api/hello, /api/healthz"

  # environment: prod is what produces the `sub=environment:prod` OIDC
  # claim — the only sub paved-road-deploy-prod trusts — so this job
  # literally cannot assume the role until a required reviewer on the
  # `prod` GitHub Environment approves it. Needs both deploy-dev (for
  # image_uri — job outputs only propagate from jobs listed directly in
  # needs:) and smoke-test-dev (so prod can't apply against a dev that
  # failed its smoke test).
  deploy-prod:
    needs: [deploy-dev, smoke-test-dev]
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      prod_url: ${{ steps.deploy.outputs.prod_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::281832122084:role/paved-road-deploy-prod
          aws-region: us-east-1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
      - name: Deploy prod (same digest deploy-dev built — never rebuild)
        id: deploy
        run: |
          cd infra/prod
          tofu init
          tofu apply -auto-approve -var image_uri=${{ needs.deploy-dev.outputs.image_uri }}
          echo "prod_url=$(tofu output -raw url)" >> "$GITHUB_OUTPUT"

  # Same reasoning as smoke-test-dev — its own check, no AWS credentials.
  smoke-test-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test prod
        run: |
          URL="${{ needs.deploy-prod.outputs.prod_url }}"
          curl -sf "$URL" | grep -q "<title>hello-world-svc</title>" || { echo "homepage: unexpected content"; exit 1; }
          HELLO=$(curl -sf "$URL/api/hello")
          echo "$HELLO" | jq -e '.message | contains("hello from")' >/dev/null || { echo "api/hello: unexpected response: $HELLO"; exit 1; }
          HEALTH=$(curl -sf "$URL/api/healthz")
          [ "$HEALTH" = "ok" ] || { echo "api/healthz: unexpected response: $HEALTH"; exit 1; }
          echo "smoke test passed: homepage, /api/hello, /api/healthz"
      - name: Post-deploy monitor
        run: |
          URL="${{ needs.deploy-prod.outputs.prod_url }}"
          for i in 1 2 3 4 5; do
            curl -sf "$URL" > /dev/null && echo "check $i ok" || { echo "check $i FAILED"; exit 1; }
            sleep 6
          done
