# Reusable workflow: agent inference. Called by hello-world-svc's ci.yml via
# workflow_call. This file's path is what bootstrap/iam.tf's
# paved-road-agents-inference trust policy matches via job_workflow_ref —
# don't rename it without updating that trust policy.
#
# ReviewBot + Triage only (session 5, PRD §14 Tier 1: "ReviewBot + Triage on
# Bedrock; agent ledger"). Inference moved off Bedrock (account-wide block,
# Error 002) to NVIDIA NIM's DeepSeek endpoint — see DECISIONS.md. Release and
# Incident stay documented design only
# in AI-GOVERNANCE.md — Release's job is already satisfied by the human
# GitHub Environment approval that runs end-to-end without an agent, and
# Incident would be bolted onto RUNBOOK.md's already-recorded manual alias
# flip. narrate-dev/narrate-prod in deploy.yml stay placeholders for the
# same reason.
name: agents

on:
  workflow_call:
    inputs:
      gates_result:
        description: "needs.gates.result from the calling workflow — this job has no direct needs: on gates itself"
        required: true
        type: string
    secrets:
      NVIDIA_API_KEY:
        description: "NVIDIA NIM API key for the DeepSeek inference call (build.nvidia.com) — Bedrock is account-blocked, see DECISIONS.md"
        required: true

permissions:
  contents: read

jobs:
  agent-narrate:
    # Same fork-gate as plan.yml's tofu-plan — the OIDC `sub` claim for a
    # pull_request-triggered run doesn't distinguish a fork PR from a
    # same-repo one, so id-token: write must be withheld from fork PRs here,
    # not just left to the IAM trust condition.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.gates_result != 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read # gh api .../jobs and `gh run view --log-failed`
      pull-requests: write # ReviewBot/Triage comment on PRs
    steps:
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::281832122084:role/paved-road-agents-inference
          aws-region: us-east-1

      # Which gate job actually failed, and its log tail — the calling
      # workflow's `gates` job is itself a reusable-workflow call, so its
      # sub-jobs share this run id and show up as "gates / <job>" here.
      - name: Identify failed gate + log tail
        id: fail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '[.jobs[] | select(.conclusion=="failure")] | .[0] // {}')
          NAME=$(echo "$FAILED" | jq -r '.name // "unknown"')
          JOB_ID=$(echo "$FAILED" | jq -r '.id // empty')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # ReviewBot explains a named policy violation (conftest/OPA);
          # Triage diagnoses everything else (lint/test/build/scan breaks).
          case "$NAME" in
            *conftest*|*workflow-integrity*) echo "agent=ReviewBot" >> "$GITHUB_OUTPUT" ;;
            *)                                echo "agent=Triage" >> "$GITHUB_OUTPUT" ;;
          esac

          # `gh run view --log` (even scoped to one --job) refuses until the
          # *whole run* is complete — found live: "run ... is still in
          # progress; logs will be available when it is complete". That's
          # fatal here since agent-narrate is itself one of this run's jobs,
          # so the run is by definition incomplete while this step runs.
          # The raw per-job logs endpoint has no such restriction — a job's
          # own log is archived as soon as that job finishes, independent of
          # its siblings — so hit it directly instead of the `run view` CLI
          # abstraction.
          if [ -n "$JOB_ID" ]; then
            # `gh api` refuses to print any response containing escape
            # sequences at all (exits 1, empty stdout) unless told
            # otherwise — found live: every prior attempt silently hit this
            # gate and fell straight to the "log unavailable" branch below,
            # which is why the log was never actually reaching Bedrock.
            # --allow-escape-sequences opts in; the sed/grep pipeline
            # afterward strips those same sequences (plus timestamps and
            # ##[group] noise) before the text is truncated and used.
            LOG=$(gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" 2>gh_log_err.txt \
              | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //; s/\x1b\[[0-9;]*[a-zA-Z]//g' \
              | grep -Ev '^##\[(group|endgroup)\]' \
              | tail -c 4000) || true
            if [ -z "$LOG" ]; then
              ERR=$(cat gh_log_err.txt)
              echo "::warning::fetching logs for job $JOB_ID returned nothing: $ERR"
              LOG="log unavailable ($ERR)"
            fi
          else
            LOG="log unavailable (no failed job id found)"
          fi
          # Random delimiter, not a fixed string: this log is raw build/test
          # output from the PR's own code, so a fixed delimiter risks the
          # classic GITHUB_OUTPUT injection if a log line happens to match it
          # (GitHub's own hardening guidance on multiline outputs).
          DELIM="GATELOG_$(openssl rand -hex 8)"
          {
            echo "log<<$DELIM"
            echo "$LOG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # AI_ENABLED=false (repo/org variable) degrades to raw structured
      # output — the pipeline is fully functional with zero inference access
      # (AI-GOVERNANCE.md §1); the model call is never load-bearing for the gate.
      - name: Explain the failure
        id: explain
        env:
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Untrusted content (build/test log output from the PR's own code)
          # goes through env, never spliced straight into the script via
          # ${{ }} — GitHub Actions substitutes ${{ }} into the script's raw
          # text before bash parses it, so shell metacharacters (backticks,
          # $(), quotes) in the log would execute. Found live: a Bedrock
          # explanation that merely quoted a job name in backticks triggered
          # `gates: command not found` — accidental this time, but the same
          # mechanism is a real injection path for anything log-derived. An
          # env var's value is set directly by the runner, not re-parsed by
          # bash, so this is immune regardless of content.
          FAILED_NAME: ${{ steps.fail.outputs.name }}
          FAILED_LOG: ${{ steps.fail.outputs.log }}
        run: |
          set -euo pipefail
          if [ "$AI_ENABLED" = "false" ]; then
            DELIM="EXPLAIN_$(openssl rand -hex 8)"
            {
              echo "text<<$DELIM"
              echo "AI narration disabled (AI_ENABLED=false) — raw gate output:"
              echo "$FAILED_LOG"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            echo "tokens_in=0" >> "$GITHUB_OUTPUT"
            echo "tokens_out=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One prompt for both agents: the "why does this rule exist" clause is
          # conditional on the log naming a policy, which covers ReviewBot's
          # mandate (AI-GOVERNANCE.md roster) without a second divergent prompt
          # path — the posted ${AGENT_NAME} header already tells the reader
          # which lane produced it. Sections are omit-if-empty on purpose: a
          # one-line lint break should render as two lines, not five padded
          # blocks, and a missing log must say so rather than be filled in.
          # -r matters: without it jq emits a JSON-quoted string, so the prompt
          # reached Bedrock wrapped in quotes with literal \n two-char
          # sequences instead of newlines. Tolerable for one prose sentence,
          # not for a multi-section format instruction. Still --arg-built —
          # the re-encoding happens in the BODY jq below.
          PROMPT=$(jq -rn --arg job "$FAILED_NAME" --arg log "$FAILED_LOG" '
              "A CI gate job named \($job) failed. Explain it to the developer who broke it. Reply in this exact Markdown, in this order, and nothing else:\n"
            + "\n**What failed** — one line: the job plus the specific check, file, or rule.\n"
            + "\n**Error** — the exact error text from the log in a fenced code block, trimmed to the lines that matter.\n"
            + "\n**Why** — one or two sentences on the root cause. If the log names a policy or rule, say what it enforces and why it exists.\n"
            + "\n**Fix** — the concrete change to make, with file and line when the log gives them.\n"
            + "\n**Recommendations** — only if there is something non-obvious worth adding.\n"
            + "\nRules: no preamble, no closing summary, no restating these instructions. One or two lines per section. Omit any heading you cannot fill from the log rather than padding it. If the log below has no usable error output, reply with exactly this and nothing else: **Error** — log content was not available for this failure.\n"
            + "\nLog tail:\n\($log)"')
          # 500, not 300: five short sections plus a fenced code block overran
          # 300 and cut off mid-sentence. NVIDIA's build.nvidia.com "Free
          # Endpoint" tier for this model is unmetered against §13's AWS
          # budget (10,000 req/day, 40 rpm — see DECISIONS.md), so there's no
          # per-call cost ceiling to watch here the way there was on Bedrock.
          BODY=$(jq -n --arg p "$PROMPT" '{model:"deepseek-ai/deepseek-v4-pro-0813",max_tokens:500,messages:[{role:"user",content:$p}]}')

          curl -sS https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -o response.json

          DELIM="EXPLAIN_$(openssl rand -hex 8)"
          {
            echo "text<<$DELIM"
            jq -r '.choices[0].message.content' response.json
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
          echo "tokens_in=$(jq -r '.usage.prompt_tokens // 0' response.json)" >> "$GITHUB_OUTPUT"
          echo "tokens_out=$(jq -r '.usage.completion_tokens // 0' response.json)" >> "$GITHUB_OUTPUT"

      - name: Post narration
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_NAME: ${{ steps.fail.outputs.agent }}
          EXPLAIN_TEXT: ${{ steps.explain.outputs.text }} # see "Explain the failure" — same injection reasoning
        run: |
          set -euo pipefail
          {
            echo "### 🤖 ${AGENT_NAME} (AI-generated)"
            echo
            echo "$EXPLAIN_TEXT"
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment.md

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md
          fi

      # Append-only audit row (agents-inference's IAM policy grants PutItem
      # only — no Update/Delete). cost_usd_est is 0: this model runs on
      # NVIDIA's build.nvidia.com free preview tier, not a metered rate card
      # (see "Explain the failure"). Left as a tracked column rather than
      # dropped so the ledger schema doesn't fork if a paid endpoint replaces
      # this one later.
      - name: Write ledger row
        if: always()
        env:
          AGENT_NAME: ${{ steps.fail.outputs.agent }}
          FAILED_NAME: ${{ steps.fail.outputs.name }}
          FAILED_LOG: ${{ steps.fail.outputs.log }} # see "Explain the failure" — same injection reasoning
          TOKENS_IN: ${{ steps.explain.outputs.tokens_in || 0 }}
          TOKENS_OUT: ${{ steps.explain.outputs.tokens_out || 0 }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          COST=0.000000
          PROMPT_HASH=$(printf '%s%s' "$FAILED_NAME" "$FAILED_LOG" | sha256sum | cut -d' ' -f1)

          aws dynamodb put-item --table-name hello-world-svc-agent-ledger --item "$(jq -n \
            --arg agent "$AGENT_NAME" \
            --arg ts "$TS" \
            --arg trigger "$FAILED_NAME" \
            --arg model "deepseek-ai/deepseek-v4-pro-0813" \
            --arg hash "$PROMPT_HASH" \
            --arg out_ref "run:${{ github.run_id }}" \
            --arg tin "$TOKENS_IN" --arg tout "$TOKENS_OUT" --arg cost "$COST" \
            '{
              agent: {S: $agent}, ts: {S: $ts}, trigger: {S: $trigger}, model: {S: $model},
              prompt_hash: {S: $hash}, output_ref: {S: $out_ref},
              tokens_in: {N: $tin}, tokens_out: {N: $tout}, cost_usd_est: {N: $cost},
              outcome: {S: "ignored"}
            }')"
