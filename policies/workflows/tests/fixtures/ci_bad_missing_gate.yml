# ci_good.yml with the policy-gate job removed entirely — scenario 10 in
# DECISIONS.md §5 ("CI file edited to remove the security stage"). Everything
# else about this file is clean (SHA-pinned, no pull_request_target, no
# write-all) so it triggers only the missing-gate check.
name: plan

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
