# ci_good.yml with the untrusted-fork-checkout pattern DECISIONS.md §1 and
# §6.4 warn against: pull_request_target + checkout of the PR head.
name: plan

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: bun test

  policy-gate:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: conftest test -p policies/terraform --all-namespaces plan.json
