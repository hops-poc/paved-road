# Plausible minimal gate workflow: SHA-pinned actions, no pull_request_target,
# no write-all, and a policy-gate job running `conftest test` — see
# policies/workflows/workflow_integrity.rego's fourth check.
name: plan

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test

  policy-gate:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: conftest test -p policies/terraform --all-namespaces plan.json
